<!DOCTYPE html>

	<html lang='en'>
	
		<head>
		
			<title> Snow Cone Template </title>
			
			<meta charset='utf-8'>
			<meta name='description' content='Snow Cone Company Template'>
			<meta name='keywords' content='snow cone'>
			<meta name='author' content='Marcelo Aparecido'>
			<meta name='viewport' content='width=device-width, initial-scale=1.0'>
			
			<link href="https://fonts.googleapis.com/css2?family=BBH+Sans+Hegarty&display=swap" rel="stylesheet">
			
			<style>

				body{
					background: url(images/snowconecompanylogo2.png)no-repeat;
					background-size: cover;
					}

				#logindiv{
					font-family: 'BBH Sans Hegarty', sans-serif;
					color: #fff;
					position: absolute;
					top: 300px;
					left: 800px;
					}

				input{
					background-color: #000000FF;
					}
					
			</style>
			
		</head>
		
		<body>

				<div id='logindiv'>

					<h1> Log In </h1>

					<form>
					<label> Email/Phone Number: </label>
					<input type='text' required='required' name='email' id='email'>
					<br><br>
					<label> Password: </label>
					<input type='text' required='required' name='password' id='password'>
					<br><br>
					<label> Remember Me </label>
					<input type='checkbox' name='check' id='check'>
					<br><br>
					<input type='submit' value='Log In' name='button' id='button'>
					</form>

					<br>

					<a href='#'> Forgot Password? </a>
					
					
		</body>

	</html>
