<!DOCTYPE html>

	<html lang='en'>
	
		<head>
		
			<title> Snow Cone Template </title>
			
			<meta charset='utf-8'>
			<meta name='description' content='Snow Cone Company Template'>
			<meta name='keywords' content='snow cone'>
			<meta name='author' content='Marcelo Aparecido'>
			<meta name='viewport' content='width=device-width, initial-scale=1.0'>
			<meta http-equiv='refresh' content='3'>
			
			<link href="https://fonts.googleapis.com/css2?family=BBH+Sans+Hegarty&display=swap" rel="stylesheet">
			
			<style>
			
				*{
					margin: 0px;
					}
					
				header{
					display: flex;
					}
					
				img{
					height: 250px;
					width: 250px;
					}
					
				#logo{
					height: 250px;
					width: 19%;
					background-color: #59a7f6;
					}
					
				#logobutton{
					height: 250px;
					width: 100%;
					background-color: #59a7f6;
					border: none;
					cursor: pointer;
					}
					
				img{
					height: 250px;
					width: 100%;
					border-radius: 100px;
					}
					
				#title{
					height: 250px;
					width: 40.5%;
					background-color: #59a7f6;
					align-items: center;
					justify-content: center;
					display: flex;
					}
					
				p{
					font-size: 72px;
					font-family: 'BBH Sans Hegarty', sans-serif;
					color: #88e7fa;
					}
					
				#buttons{
					height: 250px;
					width: 40.5%;
					background-color: #59a7f6;
					align-items: center;
					justify-content: center;
					display: flex;
					}
					
				#login{
					height: 50px;
					width: 100px;
					margin: 10px;
					background-color: #88e7fa;
					border: solid 5px #ff0070;
					cursor: pointer;
					font-family: 'BBH Sans Hegarty', sans-serif;
					transition: transform 0.2 ease;
					color: #ff0070;
					border-radius: 15px;
					}
					
				#login:hover{
					background-color: #1b9e9d;
					transition-duration: 200ms;
					}
					
				nav{
					height: 50px;
					width: 100%;
					background-color: #88e7fa;
					align-items: center;
					justify-content: center;
					display: flex;
					}
					
				#link{
					text-decoration: none;
					font-size: 25px;
					margin: 30px;
					color: #ff0070;
					font-family: 'BBH Sans Hegarty', sans-serif;
					transition: transform 0.2 ease;
					}
					
				#link:hover{
					color: #2076a4;
					transition-duration: 200ms;
					}
					
					
					
			
			</style>
			
		</head>
		
		<body>
		
			<header> 
			
				<div id='logo'><a href='index.html'><button id='logobutton'><img src='images/snowconecompanylogo.png' alt='Snow Cone Company Logo'></a></div>
				
				<div id='title'><p> SNOW HUT </p></div>
				
				<div id='buttons'> <button id='login'> Sign Up </button> <button id='login'> Log In </button></div>
				
			</header>
			
			<nav>
			
				<a id='link' href='menu.html'> Menu </a>
				<a id='link' href='calendar.html'> Calendar </a>
				<a id='link' href='contactus.html'> Contact Us </a>
				
			</nav>
			
		</body>
		
	</html>
