<!DOCTYPE html>

	<html lang='en'>
	
		<head>

			<meta charset='utf-8'>
			<meta name='description' content='Snow Cone Company Template'>
			<meta name='keywords' content='snow cone'>
			<meta name='author' content='Marcelo Aparecido'>
			<meta name='viewport' content='width=device-width, initial-scale=1.0'>
			
			<link href="https://fonts.googleapis.com/css2?family=BBH+Sans+Hegarty&display=swap" rel="stylesheet">
			
			<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
			
			<style>
			
				*{
					margin: 0px;
					}
					
				header{
					display: flex;
					}
					
				img{
					height: 250px;
					width: 250px;
					}
					
				#logo{
					height: 250px;
					width: 19%;
					background-color: #59a7f6;
					}
					
				#logobutton{
					height: 250px;
					width: 100%;
					background-color: #59a7f6;
					border: none;
					cursor: pointer;
					}
					
				#titlediv{
					height: 250px;
					width: 40.5%;
					background-color: #59a7f6;
					align-items: center;
					justify-content: center;
					display: flex;
					}
					
				#title{
					font-size: 72px;
					font-family: 'BBH Sans Hegarty', sans-serif;
					color: #88e7fa;
					}
					
				#buttons{
					height: 250px;
					width: 40.5%;
					background-color: #59a7f6;
					align-items: center;
					justify-content: center;
					display: flex;
					}
					
				#login{
					height: 75px;
					width: 150px;
					margin: 10px;
					background-color: #88e7fa;
					border: solid 5px #ff0070;
					cursor: pointer;
					font-family: 'BBH Sans Hegarty', sans-serif;
					font-size: 20px;
					transition: transform 0.2 ease;
					color: #ff0070;
					border-radius: 15px;
					}
					
				#login:hover{
					background-color: #37D9FA;
					transition-duration: 200ms;
					}
					
				nav{
					height: 50px;
					width: 100%;
					background-color: #88e7fa;
					align-items: center;
					justify-content: center;
					display: flex;
					position: sticky;
					top: 0px;
					}
					
				#link{
					text-decoration: none;
					font-size: 25px;
					margin: 30px;
					color: #ff0070;
					font-family: 'BBH Sans Hegarty', sans-serif;

					}
					
				#link:hover{
					color: #2076a4;
					transition-duration: 200ms;
					}
					
				#flav{
					display: flex;
					margin: 50px;
					}
					
				#conepic{
					border-radius: 50px;
					}
					
				.desc{
					font-size: 72px;
					font-family: 'BBH Sans Hegarty', sans-serif;
					align-items: center;
					justify-content: center;
					display: flex;
					margin-left: 20px;
					}
					
				#desc1{
					color: #2390bb;
					font-size: 60px;
					}
					
				#desc2{
					color: #668e52;
					}
				
				#desc3{
					color: #dc727c;
					}
					
				#desc4{
					color: #f6783a;
					}
					
				#desc5{
					color: #f5c52e;
					}
					
				#desc6{
					color: #69063a;
					}
					
				.price{
					font-size: 30px;
					}
					
				body{
					background-color: #59a7f6;
					}

					color: #ff0070;
					align-items: center;
					justify-content: center;
					display: flex;
					font-family: 'BBH Sans Hegarty', sans-serif;
					padding: 20px;
					}
					
				#calendartext{
					font-size: 24px;
					color: #2390bb;
					align-items: center;
					justify-content: center;
					display: flex;
					font-family: 'BBH Sans Hegarty', sans-serif;
					padding-bottom: 50px;
					}

					height: 125px;
					width: 125px;
					color: #FF0070;
					background-color: #88e7fa;
					font-size: 75px;
					font-family: 'BBH Sans Hegarty', sans-serif;
					border: double 15px #FF0070;
					border-radius: 125px;
					align-items: center;
					justify-content: center;
					display; flex;
					transition: transform 0.2 ease;
					}
					
				#calendarbutton:hover{
					cursor: pointer;
					background-color: #37D9FA;
					transition-duration: 200ms;
					}
					
				#calendarbuttondiv{
					padding-bottom: 100px;
					}

					height: 65px;
					width: 65px;
					margin: 10px;
					border-radius: 65px;
					transition: transform 0.2 ease;
					}

					background: url(images/TBBfacebooklogo.png)no-repeat;
					background-size: cover;
					}
					
				#instagram{
					background: url(images/TBBinstagramlogo.png)no-repeat;
					background-size: cover;
					}
					
				#snapchat{
					background: url(images/TBBsnapchatlogo.png)no-repeat;
					background-size: cover;
					}
					
				#tiktok{

					}

					}

					background: url(images/TBORfacebooklogo.png)no-repeat;
					background-size: cover;
					transition-duration: 200ms;
					}

					}

					background-size: cover;
					transition-duration: 200ms;
					}

					background: url(images/TBORtiktoklogo.png)no-repeat;
					background-size: cover;
					transition-duration: 200ms;
					}
					
				#youtube:hover{
					background: url(images/TBORyoutubelogo.png)no-repeat;
					background-size: cover;
					transition-duration: 200ms;
					}
					
				#x:hover{
					background: url(images/TBWxlogo.png)no-repeat;
					background-size: cover;
					transition-duration: 200ms;
					}

					height: 85;
					width: 100%;
					border-top: solid 5px #88e7fa;
					background-color: #fff;
					display: flex;
					}

				<div id='buttons'> <button id='login'> Sign Up </button> <button id='login'> Log In </button></div>
				
			</header>
			
			<nav>
			
				<a id='link' href='menu.html'> Menu </a>
				<a id='link' href='calendar.html'> Calendar </a>
				<a id='link' href='contactus.html'> Contact Us </a>
				
			</nav>
			
			<main>
			
				<section id='flavors'>
				
					<div id='flav'><img id='conepic' src='images/BLUsnowcone1.jpg' alt='Blue Snow Cone'><p class='desc'><span id='desc1'> Blue-Raspberry Breeze &nbsp;</span><span class='price'> | 6.99</span></p></div>
					<div id='flav'><img id='conepic' src='images/GREsnowcone1.jpg' alt='Blue Snow Cone'><p class='desc'><span id='desc2'> Lime Fun Time &nbsp;</span><span class='price'> | 6.99 </span></p></div>
					<div id='flav'><img id='conepic' src='images/PINsnowcone1.jpg' alt='Blue Snow Cone'><p class='desc'><span id='desc3'> Strawberry Blast &nbsp;</span><span class='price'> | 6.99 </span></p></div>
					<div id='flav'><img id='conepic' src='images/ORsnowcone1.jpg' alt='Blue Snow Cone'><p class='desc'><span id='desc4'> Citrus Rush &nbsp;</span><span class='price'> | 6.99 </span></p></div>

						<h1 id='book'> Book an event today! </h1>

			<footer>
				
				<a href='#'><div id='facebook'></div></a>
