<!DOCTYPE html>

	<html lang='en'>
	
		<head>
		
			<title> Snow Cone Template </title>
			
			<meta charset='utf-8'>
			<meta name='description' content='Snow Cone Company Template'>
			<meta name='keywords' content='snow cone'>
			<meta name='author' content='Marcelo Aparecido'>
			<meta name='viewport' content='width=device-width, initial-scale=1.0'>
			
			<link href="https://fonts.googleapis.com/css2?family=BBH+Sans+Hegarty&display=swap" rel="stylesheet">
			
			<style>
			
				*{
					margin: 0px;
					}
					
				header{
					display: flex;
					}
					
				img{
					height: 250px;
					width: 250px;
					}
					
				#logo{
					height: 250px;
					width: 19%;
					background-color: #59a7f6;
					}
					
				#logobutton{
					height: 250px;
					width: 100%;
					background-color: #59a7f6;
					border: none;
					cursor: pointer;
					}
					
				img{
					height: 250px;
					width: 100%;
					border-radius: 100px;
					}
					
				#title{
					height: 250px;
					width: 40.5%;
					background-color: #59a7f6;
					align-items: center;
					justify-content: center;
					display: flex;
					}
					
				p{
					font-size: 72px;
					font-family: 'BBH Sans Hegarty', sans-serif;
					color: #88e7fa;
					}
					
				#buttons{
					height: 250px;
					width: 40.5%;
					background-color: #59a7f6;
					align-items: center;
					justify-content: center;
					display: flex;
					}
					
				#login{
					height: 75px;
					width: 150px;
					margin: 10px;
					background-color: #88e7fa;
					border: solid 5px #ff0070;
					cursor: pointer;
					font-family: 'BBH Sans Hegarty', sans-serif;
					font-size: 20px;
					transition: transform 0.2 ease;
					color: #ff0070;
					border-radius: 15px;
					}
					
				#login:hover{
					background-color: #37D9FA;
					transition-duration: 200ms;
					}
					
				nav{
					height: 50px;
					width: 100%;
					background-color: #88e7fa;
					align-items: center;
					justify-content: center;
					display: flex;
					position: sticky;
					top: 0px;
					}
					
				#link{
					text-decoration: none;
					font-size: 25px;
					margin: 30px;
					color: #ff0070;
					font-family: 'BBH Sans Hegarty', sans-serif;
					transition: transform 0.2 ease;
					}
					
				#link:hover{
					color: #2076a4;
					transition-duration: 200ms;
					}
					
				form, input{
					font-size: 50px;
					}
					
				fieldset{
					border: solid 5px #ff0070;
					}
					
				#mySubmit{
					background-color: #88e7fa;
					color: #ff0070; 
					border: solid 5px #ff0070;
					font-family: BBH Sans Hegarty, sans-serif;
					padding: 20px;
					transition: transform 0.2 ease;
					}
					
				#mySubmit:hover{
					cursor: pointer;
					background-color: #37D9FA;
					transition-duration: 200ms;
					}
					
				#facebook, #instagram, #snapchat, #tiktok, #youtube, #x{
					height: 65px;
					width: 65px;
					margin: 10px;
					border-radius: 65px;
					transition: transform 0.2 ease;
					}
					
				#facebook{
					background: url(images/TBBfacebooklogo.png)no-repeat;
					background-size: cover;
					}
					
				#instagram{
					background: url(images/TBBinstagramlogo.png)no-repeat;
					background-size: cover;
					}
					
				#snapchat{
					background: url(images/TBBsnapchatlogo.png)no-repeat;
					background-size: cover;
					}
					
				#tiktok{
					background: url(images/TBBtiktoklogo.png)no-repeat;
					background-size: cover;
					}
					
				#youtube{
					background: url(images/TBByoutubelogo.png)no-repeat;
					background-size: cover;
					}
					
				#x{
					background: url(images/TBORxlogo.png)no-repeat;
					background-size: cover;
					}
					
				#facebook:hover{
					background: url(images/TBORfacebooklogo.png)no-repeat;
					background-size: cover;
					transition-duration: 200ms;
					}
					
				#instagram:hover{
					background: url(images/TBORinstagramlogo.png)no-repeat;
					background-size: cover;
					transition-duration: 200ms;
					}
					
				#snapchat:hover{
					background: url(images/TBORsnapchatlogo.png)no-repeat;
					background-size: cover;
					transition-duration: 200ms;
					}
					
				#tiktok:hover{
					background: url(images/TBORtiktoklogo.png)no-repeat;
					background-size: cover;
					transition-duration: 200ms;
					}
					
				#youtube:hover{
					background: url(images/TBORyoutubelogo.png)no-repeat;
					background-size: cover;
					transition-duration: 200ms;
					}
					
				#x:hover{
					background: url(images/TBWxlogo.png)no-repeat;
					background-size: cover;
					transition-duration: 200ms;
					}
					
				footer{
					height: 85;
					width: 100%;
					border-top: solid 5px #88e7fa;
					background-color: #fff;
					display: flex;
					}
			
			</style>
			
		</head>
		
		<body>
		
			<header> 
			
				<div id='logo'><a href='index.html'><button id='logobutton'><img src='images/snowconecompanylogo.png' alt='Snow Cone Company Logo'></a></div>
				
				<div id='title'><p> SNOW HUT </p></div>
				
				<div id='buttons'> <button id='login'> Sign Up </button> <button id='login'> Log In </button></div>
				
			</header>
			
			<nav>
			
				<a id='link' href='menu.html'> Menu </a>
				<a id='link' href='calendar.html'> Calendar </a>
				<a id='link' href='contactus.html'> Contact Us </a>
				
			</nav>
				
			<main>
			
				<form style='background-color: #59a7f6; font-family: BBH Sans Hegarty, sans-serif; padding: 10px; color: #ff0070'>
					<fieldset>
						<legend> Contact Us: </legend>
						<label> Name: </label>
						<input style='background-color: #88e7fa; border: solid 3px #ff0070;' type='text' name='myName' id='myName' tabindex='1'> <br><br>
						<label> E-Mail: </label>
						<input style='background-color: #88e7fa; border: solid 3px #ff0070;' type='text' name='myEmail' id='myEmail' tabindex='2'>
						<br><br>
						<label style='float:left;'> Comments: </label>
						<textarea style='background-color: #88e7fa; border: solid 3px #ff0070;' type='text' name='myComments' id='myComments' rows='4' cols='25' tabindex='3'></textarea>
						<br><br>
						<input id='mySubmit' type='submit' value='Submit' tabindex='4'>
					</fieldset>
				</form>
				
			</main>	
			
			<footer>
				
				<a href='#'><div id='facebook'></div></a>
				<a href='#'><div id='instagram'></div></a>
				<a href='#'><div id='snapchat'></div></a>
				<a href='#'><div id='tiktok'></div></a>
				<a href='#'><div id='youtube'></div></a>
				<a href='#'><div id='x'></div></a>
				
			</footer>
			
		</body>
		
	</html>
